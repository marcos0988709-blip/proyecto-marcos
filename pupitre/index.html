<title>Pupitre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: cuaderno cuadriculado — sidebar en escritorio, barra inferior en móvil; tinta azul + subrayador amarillo */
:root{
  --paper:#F6F7FB; --sheet:#FFFFFF; --grid:rgba(47,85,212,.055);
  --ink:#16213D; --muted:#5F6A85; --faint:#8D96AD; --line:#E2E6F0; --line-strong:#CBD2E2;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --accent-soft:#E7ECFC;
  --marker:#FFE45C; --marker-ink:#3B3200; --marker-soft:rgba(255,228,92,.45);
  --ok:#1F8A5B; --ok-soft:#E1F4EA; --warn:#B86E00; --warn-soft:#FFF1D6; --bad:#C8364B; --bad-soft:#FCE6E9;
  --shadow:0 1px 2px rgba(22,33,61,.06),0 8px 24px -12px rgba(22,33,61,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --r-sm:9px;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1320; --sheet:#161D2E; --grid:rgba(124,155,255,.05);
  --ink:#E7ECF6; --muted:#A1AAC2; --faint:#717B95; --line:#252E44; --line-strong:#34405C;
  --accent:#7D9BFF; --accent-ink:#0B1020; --accent-soft:#1E2950;
  --marker:#F2D64B; --marker-ink:#2A2300; --marker-soft:rgba(242,214,75,.22);
  --ok:#4CC38A; --ok-soft:#14301F; --warn:#F0B44C; --warn-soft:#33270F; --bad:#FF7A8C; --bad-soft:#3A1A21;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1320; --sheet:#161D2E; --grid:rgba(124,155,255,.05);
  --ink:#E7ECF6; --muted:#A1AAC2; --faint:#717B95; --line:#252E44; --line-strong:#34405C;
  --accent:#7D9BFF; --accent-ink:#0B1020; --accent-soft:#1E2950;
  --marker:#F2D64B; --marker-ink:#2A2300; --marker-soft:rgba(242,214,75,.22);
  --ok:#4CC38A; --ok-soft:#14301F; --warn:#F0B44C; --warn-soft:#33270F; --bad:#FF7A8C; --bad-soft:#3A1A21;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;line-height:1.1}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:inset 0 -6px 0 var(--marker)}
.brand-mark svg{width:18px;height:18px}
.top-actions{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="cloud"] i{background:var(--ok)} .sync[data-s="saving"] i{background:var(--warn)} .sync[data-s="error"] i{background:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:18px;height:18px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(6,1fr)}
.nav-a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--faint);text-decoration:none;font-size:.68rem;font-weight:600;-webkit-tap-highlight-color:transparent}
.nav-a svg{width:22px;height:22px}
.nav-a[aria-current="page"]{color:var(--accent)}
.nav-a[aria-current="page"] svg{filter:drop-shadow(0 3px 0 var(--marker-soft))}

@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--sheet) 70%,transparent)}
  .side .nav{display:flex;flex-direction:column;gap:2px}
  .side .nav-a{flex-direction:row;gap:12px;font-size:.92rem;padding:10px 12px;color:var(--muted)}
  .side .nav-a:hover{background:var(--accent-soft);color:var(--ink)}
  .side .nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side .nav-a svg{width:19px;height:19px}
  .main{padding-block:26px 48px}
  .topbar .brand{display:none}
  .side-timer{margin-top:auto}
}

/* ---------- primitives ---------- */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.mark{background:linear-gradient(transparent 55%,var(--marker-soft) 55%);padding:0 2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-strong);background:var(--sheet);padding:9px 14px;font-weight:600;font-size:.9rem;white-space:nowrap;transition:transform .12s ease,background .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{border-color:var(--accent);filter:brightness(1.07)}
.btn-m{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.btn-m:hover{border-color:var(--marker);filter:brightness(1.04)}
.btn-g{border-color:transparent;background:transparent;color:var(--muted)}
.btn-g:hover{color:var(--ink);border-color:var(--line)}
.btn-d{color:var(--bad);border-color:var(--bad-soft)}
.btn-d:hover{border-color:var(--bad)}
.btn-sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn-lg{padding:13px 22px;font-size:1rem;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.pill.mk{background:var(--marker);color:var(--marker-ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--accent))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:var(--paper);border-radius:10px;padding:9px 11px;font-size:16px;min-width:0}
textarea.input{resize:vertical;min-height:110px;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--sheet);font-weight:600;font-size:.85rem}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));box-shadow:inset 0 0 0 1px var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--sheet))}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:var(--marker-soft);border:1px solid color-mix(in srgb,var(--marker) 60%,transparent);font-size:.88rem}
.view-in{animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Hoy ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello .date{font-size:.95rem;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.stat{display:flex;align-items:center;gap:14px;padding:14px 16px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.mini-ring{width:46px;height:46px;flex:none}
.flame{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--marker);color:var(--marker-ink);flex:none}
.flame svg{width:24px;height:24px}
.blk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .t{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:46px}
.blk .ttl{font-weight:600;min-width:0;overflow-wrap:anywhere}
.blk.done .ttl{text-decoration:line-through;color:var(--faint)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);background:var(--sheet);display:grid;place-items:center;flex:none;padding:0;color:var(--accent-ink)}
.check[aria-checked="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.exam{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exam:first-child{border-top:0}
.exam .cd{min-width:58px;text-align:center;border-radius:10px;padding:6px 4px;background:var(--accent-soft);color:var(--accent)}
.exam .cd b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1}
.exam .cd small{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.exam .cd.bad{background:var(--bad-soft);color:var(--bad)} .exam .cd.warn{background:var(--warn-soft);color:var(--warn)}
.prio{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prio:first-child{border-top:0}

/* ---------- Foco ---------- */
.focus-wrap{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:980px){.focus-wrap{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.timer-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 18px}
.ring{position:relative;width:min(78vw,320px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--c,var(--accent));transition:stroke-dashoffset .3s linear}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.clock{font-family:var(--f-mono);font-weight:700;font-size:clamp(3rem,13vw,4.4rem);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.phase{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.cycle-dots{display:flex;gap:6px;margin-top:8px}
.cycle-dots i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.cycle-dots i.on{background:var(--marker);box-shadow:0 0 0 2px color-mix(in srgb,var(--marker) 40%,transparent)}
.timer-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.focus-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;width:100%;max-width:520px}
.durations{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:10px}
.sess{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.sess:first-child{border-top:0}

/* ---------- Asignaturas ---------- */
.subj-card{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;border-top:4px solid var(--c);transition:transform .15s ease,box-shadow .15s ease;font:inherit;color:inherit}
.subj-card:hover{transform:translateY(-2px)}
.subj-card .nm{font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.2;overflow-wrap:anywhere}
.subj-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.topic{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic .tt{min-width:0;overflow-wrap:anywhere}
.topic.done .tt{text-decoration:line-through;color:var(--faint)}
.wbtn{border:1px solid var(--line-strong);background:transparent;border-radius:99px;font-size:.7rem;font-weight:700;padding:3px 8px;color:var(--muted)}
.wbtn[data-w="3"]{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.wbtn[data-w="2"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.x-btn{border:0;background:transparent;color:var(--faint);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;padding:0}
.x-btn:hover{color:var(--bad);background:var(--bad-soft)}
.x-btn svg{width:15px;height:15px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid var(--sheet);background:var(--c);box-shadow:0 0 0 1px var(--line-strong)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.subj-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.subj-head .sw{width:14px;align-self:stretch;border-radius:6px;background:var(--c)}

/* ---------- Plan ---------- */
.week{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:1100px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}}
.day{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:2px 6px;flex-wrap:wrap}
.day-h span{white-space:nowrap}
.day-h b{font-family:var(--f-display);font-size:1rem;text-transform:capitalize}
.pblock{border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--c) 11%,var(--sheet));border-left:4px solid var(--c);display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%;font:inherit;color:inherit}
.pblock .pt{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.pblock .pn{font-weight:600;font-size:.86rem;line-height:1.3;overflow-wrap:anywhere}
.pblock.done{opacity:.55}
.pblock.done .pn{text-decoration:line-through}
.add-day{border:1.5px dashed var(--line-strong);background:transparent;border-radius:10px;padding:7px;color:var(--faint);font-weight:600;font-size:.8rem}
.add-day:hover{color:var(--accent);border-color:var(--accent)}
.avail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.avail label{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.avail input{text-align:center;padding:8px 2px}

/* ---------- Tutor ---------- */
.chat{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-in{display:flex;gap:8px;margin-top:12px}
.chat-in textarea{min-height:46px;max-height:160px;flex:1}
.prose{line-height:1.6;overflow-wrap:anywhere;min-width:0}
.prose h1,.prose h2,.prose h3{margin:14px 0 6px;font-size:1.05rem}
.prose h1:first-child,.prose h2:first-child,.prose h3:first-child{margin-top:0}
.prose p{margin:6px 0}
.prose ul,.prose ol{margin:6px 0;padding-left:22px}
.prose li{margin:3px 0}
.prose code{font-family:var(--f-mono);font-size:.86em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
.prose pre{background:var(--paper);border:1px solid var(--line);padding:10px 12px;border-radius:10px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose strong{background:linear-gradient(transparent 60%,var(--marker-soft) 60%)}
.prose .tbl{overflow-x:auto;margin:8px 0}
.prose table{border-collapse:collapse;font-size:.88rem;min-width:100%}
.prose th,.prose td{border:1px solid var(--line-strong);padding:6px 9px;text-align:left;vertical-align:top}
.prose th{background:var(--accent-soft)}
.q{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .qt{font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line-strong);background:var(--sheet);border-radius:10px;padding:10px 12px;font-size:.92rem}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:.86rem;color:var(--muted);padding:8px 12px;border-left:3px solid var(--marker);background:var(--marker-soft);border-radius:0 8px 8px 0}
.flash{perspective:1200px;width:100%;max-width:560px;margin:0 auto}
.flash-in{position:relative;min-height:230px;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.flash-in.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line-strong);background:var(--sheet);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:10px;overflow-y:auto}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--marker) 16%,var(--sheet))}
.face .fq{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.3}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.ai-off{font-size:.86rem;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}

/* ---------- Progreso ---------- */
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;width:max-content}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--line))}
.heat i[data-l="4"]{background:var(--accent);box-shadow:inset 0 -3px 0 var(--marker)}
.heat i.fut{background:transparent}
.legend{display:flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px}
.hbar{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:.88rem}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.wb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wb i{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--accent);min-height:3px}
.wb i.goal{background:var(--ok)}
.wb small{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.wb b{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:500}

/* ---------- Onboarding ---------- */
.onb{display:grid;gap:22px;grid-template-columns:1fr;align-items:center;padding-block:10px}
@media (min-width:900px){.onb{grid-template-columns:1.05fr 1fr}}
.onb h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.02}
.onb .lead{font-size:1.08rem;color:var(--muted);max-width:52ch;margin-top:12px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin-top:6px}
.feat div{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.feat svg{width:20px;height:20px;color:var(--accent);flex:none;margin-top:2px}
.preview{transform:rotate(-1.2deg)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.mod{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-strong);border-radius:11px;cursor:pointer;background:var(--sheet);line-height:1.3}
.mod input{width:18px;height:18px;flex:none;margin:1px 0 0;accent-color:var(--c)}
.mod .dot{margin-top:4px}
.mod:has(input:checked){border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.school{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}

/* ---------- Modal & toast ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,28,.45);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px));animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:calc(100% - 12px);overflow-y:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (min-width:640px){.scrim{align-items:center;padding:24px}.sheet{border-radius:18px;padding:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);animation:up .25s ease;max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:28px}}

(() => {
"use strict";

/* ================= utilidades ================= */

];

const hasTpl = t => state && state.subjects.some(x => x.tpl === t.key || x.name === t.name);
const tplPicker = (prefix, onlyMissing) => CURSO.filter(t => !onlyMissing || !hasTpl(t)).map(t => `<label class="mod" style="--c:${t.color}"><input type="checkbox" data-${prefix}="${t.key}" ${t.def ? "checked" : ""}><span class="dot"></span><span style="min-width:0"><b>${esc(t.name)}</b><span class="tiny muted" style="display:block">${esc(t.ca)} · ${t.topics.length} temas${t.def ? "" : " · según centro"}</span></span></label>`).join("");

const I = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/>',

};

/* ================= estado ================= */
const LS_KEY = "pupitre.v1", LS_TIMER = "pupitre.timer", LS_UI = "pupitre.ui";
const lsGet = k => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function blankState() {
  return {
    v: 1, updatedAt: Date.now(), example: false,
    profile: { name: "", goalMin: 120, school: "" },
    settings: { focus: 25, short: 5, long: 15, longEvery: 4, sound: true, avail: [120, 120, 120, 120, 90, 180, 60], startTime: "17:00" },
    subjects: [], sessions: [], plan: [], tutor: {},
  };
}
function migrate(s) {
  const b = blankState();
  s = Object.assign(b, s || {});
  s.profile = Object.assign(b.profile, s.profile || {});
  s.settings = Object.assign(blankState().settings, s.settings || {});
  for (const k of ["subjects", "sessions", "plan"]) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.tutor || typeof s.tutor !== "object") s.tutor = {};
  s.subjects.forEach(x => { x.exams = x.exams || []; x.topics = x.topics || []; x.notes = x.notes || ""; x.kind = x.kind || "asignatura"; });
  return s;
}

let state = lsGet(LS_KEY) ? migrate(lsGet(LS_KEY)) : null;
const ui = Object.assign({ tutorSubj: null, tutorTab: "chat", weekOffset: 0 }, lsGet(LS_UI) || {});
const saveUi = () => lsSet(LS_UI, { tutorSubj: ui.tutorSubj, tutorTab: ui.tutorTab });

/* ---------- sincronización con la cuenta (db) ---------- */
let db = null, docRef = null, remoteTimer = null, writing = false, dirty = false, dbAnswered = false, sample = null;
function setSync(s) {
  const el = $("#sync"); if (!el) return;
  el.dataset.s = s;
  el.lastElementChild.textContent = { local: "En este dispositivo", cloud: "Guardado en tu cuenta", saving: "Guardando…", error: "Sin conexión · guardado local", loading: "Conectando…" }[s];
}
function prune() {
  for (const k in state.tutor) { const t = state.tutor[k]; if (t.chat && t.chat.length > 20) t.chat = t.chat.slice(-20); }
  let json = JSON.stringify(state);
  if (json.length > 230000) {
    for (const k in state.tutor) { state.tutor[k].chat = (state.tutor[k].chat || []).slice(-6); state.tutor[k].summary = ""; }
    json = JSON.stringify(state);
  }
  while (json.length > 230000 && state.sessions.length > 200) { state.sessions.splice(0, 200); json = JSON.stringify(state); }
  return json;
}
function commit(rerender = true) {
  state.updatedAt = Date.now();
  lsSet(LS_KEY, state);
  scheduleRemote();

function subjContext(s, maxNotes = 6000) {
  const ex = s.exams.filter(e => daysUntil(e.date) >= 0).map(e => `${e.title} (${e.date}, en ${daysUntil(e.date)} días)`).join("; ") || "sin fecha";

function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n"); let out = "", list = null, inCode = false, code = [], tbl = [];
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  const flushTbl = () => { if (!tbl.length) return; const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()); const [h, ...b] = tbl.filter(r => !/^[\s|:-]+$/.test(r)); if (h) out += `<div class="tbl"><table><thead><tr>${cells(h).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${b.map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; tbl = []; };
  for (const raw of lines) {
    const l = raw;
    if (/^```/.test(l.trim())) { if (inCode) { out += `<pre><code>${esc(code.join("\n"))}</code></pre>`; code = []; inCode = false; } else { closeList(); flushTbl(); inCode = true; } continue; }
    if (inCode) { code.push(l); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) { closeList(); tbl.push(l); continue; } else flushTbl();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { closeList(); const n = Math.min(3, m[1].length + 1); out += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { closeList(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { closeList(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { closeList(); out += "<hr style='border:0;border-top:1px solid var(--line);margin:12px 0'>"; continue; }
    if (!l.trim()) { closeList(); continue; }
    closeList(); out += `<p>${inline(l)}</p>`;
  }
  if (inCode) out += `<pre><code>${esc(code.join("\n"))}</code></pre>`;
  closeList(); flushTbl(); return out;
}

function viewProgreso() {
  const m = byDay(); const total = state.sessions.reduce((a, s) => a + s.min, 0);
  const weeks = 18; const start = addDays(mondayOf(new Date()), -(weeks - 1) * 7); const todayK = dkey();
  const goal = state.profile.goalMin || 120;
  let cells = ""; for (let i = 0; i < weeks * 7; i++) { const d = addDays(start, i), k = dkey(d), v = m[k] || 0; const l = v === 0 ? 0 : v < goal * .34 ? 1 : v < goal * .67 ? 2 : v < goal ? 3 : 4; cells += k > todayK ? `<i class="fut"></i>` : `<i data-l="${l}" title="${shortDate(d)}: ${fmtMin(v)}"></i>`; }
  const mon = mondayOf(new Date()); const wk = Array.from({ length: 7 }, (_, i) => { const k = dkey(addDays(mon, i)); return { k, v: m[k] || 0, d: addDays(mon, i) }; });
  const maxW = Math.max(goal, ...wk.map(x => x.v));
  const per = state.subjects.map(s => ({ s, v: subjMinutes(s.id, 30) })).sort((a, b) => b.v - a.v); const maxP = Math.max(1, ...per.map(x => x.v));
  const daysActive = Object.keys(m).length; const best = Object.entries(m).sort((a, b) => b[1] - a[1])[0];
  let bestStreak = 0, run = 0; const ks = Object.keys(m).sort(); let prev = null; for (const k of ks) { run = prev && dkey(addDays(parseD(prev), 1)) === k ? run + 1 : 1; bestStreak = Math.max(bestStreak, run); prev = k; }
  return `<div class="stack" style="gap:18px">
    <div><h1>Progreso</h1><p class="muted">La constancia gana a los atracones. Esto es lo que llevas.</p></div>
    <div class="stats">
      <div class="card stat"><div><b>${fmtH(total)}</b><small>de foco en total</small></div></div>
      <div class="card stat"><div><b>${streak()} / ${bestStreak}</b><small>racha actual / mejor racha</small></div></div>
      <div class="card stat"><div><b>${daysActive}</b><small>días estudiados</small></div></div>
      <div class="card stat"><div><b>${best ? fmtMin(best[1]) : "—"}</b><small>${best ? "mejor día · " + shortDate(parseD(best[0])) : "mejor día"}</small></div></div>
    </div>
    <section class="card"><div class="card-h"><h2>Constancia · últimas ${weeks} semanas</h2><div class="legend">Menos<i style="background:var(--line)"></i><i style="background:color-mix(in srgb,var(--accent) 30%,var(--line))"></i><i style="background:color-mix(in srgb,var(--accent) 55%,var(--line))"></i><i style="background:color-mix(in srgb,var(--accent) 80%,var(--line))"></i><i style="background:var(--accent)"></i>Objetivo</div></div>
      <div class="heat-wrap"><div class="row" style="gap:6px;flex-wrap:nowrap;align-items:flex-start"><div style="display:grid;grid-template-rows:repeat(7,14px);gap:4px;font-size:.62rem;color:var(--faint);line-height:14px">${DOW.map((d, i) => `<span>${i % 2 === 0 ? d : ""}</span>`).join("")}</div><div class="heat">${cells}</div></div></div></section>
    <div class="grid g2">
      <section class="card"><div class="card-h"><h2>Esta semana</h2><span class="tiny muted">verde = objetivo de ${goal} min cumplido</span></div>
        <div class="weekbars">${wk.map(x => `<div class="wb"><b>${x.v ? x.v : ""}</b><i class="${x.v >= goal ? "goal" : ""}" style="height:${(x.v / maxW * 100).toFixed(1)}%;${x.k > todayK ? "opacity:.25" : ""}"></i><small>${x.d.toLocaleDateString("es-ES", { weekday: "short" }).slice(0, 2)}</small></div>`).join("")}</div></section>
      <section class="card"><div class="card-h"><h2>Por asignatura · 30 días</h2></div>
        ${per.length ? per.map(({ s, v }) => `<div class="hbar"><span class="nm row" style="gap:7px;flex-wrap:nowrap"><span class="dot" style="--c:${s.color}"></span><span style="overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</span></span><div class="bar" style="--c:${s.color}"><i style="width:${(v / maxP * 100).toFixed(1)}%"></i></div><span class="num small muted">${fmtH(v)}</span></div>`).join("") : `<p class="muted small">Sin datos aún.</p>`}
        ${per.length > 1 && per[per.length - 1].v < maxP * .2 ? `<p class="tiny muted" style="margin-top:10px">Ojo: <b>${esc(per[per.length - 1].s.name)}</b> se está quedando atrás.</p>` : ""}
      </section>
    </div>
  </div>`;
}

function openModal(html, bind) {

  const sc = $("#scrim"); sc.addEventListener("click", e => { if (e.target === sc || e.target.closest("[data-close]")) closeModal(); });

}
function closeModal() { $("#layer").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#scrim")) closeModal(); });
let toastT = null;
function toast(msg) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

  const g = e.target.closest("[data-go]"); if (g && !e.target.closest("[data-act]")) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a || !state) return;

    case "cycle-w": { const t = cur.topics.find(x => x.id === id); t.w = ((t.w || 2) % 3) + 1; commit(); break; }
    case "del-topic": cur.topics = cur.topics.filter(x => x.id !== id); commit(); break;

    case "focus-block": focusBlock(id); break;

    case "edit-block": blockModal(state.plan.find(x => x.id === id)); break;
