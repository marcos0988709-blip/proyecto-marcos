<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pupitre</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pupitre">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: pizarra negra — sidebar en escritorio, barra inferior en móvil; tinta azul eléctrica + subrayador amarillo. Tema único oscuro (elegido por el usuario). */
:root{
  --paper:#000000; --sheet:#0B0B0E; --sheet-2:#131318; --grid:rgba(255,255,255,.028);
  --ink:#F3F4F8; --muted:#A4A8B6; --faint:#6C707E; --line:#1D1E25; --line-strong:#2C2E39;
  --accent:#5B86FF; --accent-ink:#030716; --accent-soft:rgba(91,134,255,.15); --glow:0 0 0 1px rgba(91,134,255,.35),0 8px 30px -8px rgba(91,134,255,.55);
  --marker:#FFE45C; --marker-ink:#231D00; --marker-soft:rgba(255,228,92,.17);
  --ok:#3DDC97; --ok-soft:rgba(61,220,151,.13); --warn:#FFB547; --warn-soft:rgba(255,181,71,.14); --bad:#FF5C7A; --bad-soft:rgba(255,92,122,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px -18px rgba(0,0,0,.9);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.35rem);font-weight:800;line-height:1.08}
h2{font-size:1.14rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;text-decoration:none}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-size:17px;box-shadow:inset 0 -6px 0 var(--marker),var(--glow)}
.top-actions{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="cloud"] i{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sync[data-s="saving"] i{background:var(--warn)} .sync[data-s="error"] i{background:var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--muted);font-size:17px}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:18px;height:18px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(6,1fr)}
.nav-a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--faint);text-decoration:none;font-size:.66rem;font-weight:700;-webkit-tap-highlight-color:transparent;transition:background .15s ease}
.nav-a .emo{font-size:21px;filter:grayscale(.85) opacity(.7);transition:filter .15s ease,transform .15s ease}
.nav-a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.nav-a[aria-current="page"] .emo{filter:none;transform:scale(1.08)}
@media (min-width:900px){
  .app{grid-template-columns:236px 1fr}
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--sheet)}
  .side .nav{display:flex;flex-direction:column;gap:3px}
  .side .nav-a{flex-direction:row;gap:12px;font-size:.93rem;padding:10px 12px;color:var(--muted);font-weight:600}
  .side .nav-a .emo{font-size:18px}
  .side .nav-a:hover{background:var(--sheet-2);color:var(--ink)}
  .side .nav-a:hover .emo{filter:none}
  .main{padding-block:24px 48px}
  .topbar .brand{visibility:hidden}
  .side-timer{margin-top:auto}
}

/* primitives */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.mark{background:linear-gradient(transparent 58%,rgba(255,228,92,.38) 58%);padding:0 2px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid var(--line-strong);background:var(--sheet-2);padding:9px 14px;font-weight:650;font-size:.9rem;white-space:nowrap;transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.btn-p:hover{border-color:var(--accent);filter:brightness(1.1)}
.btn-m{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.btn-m:hover{border-color:var(--marker);filter:brightness(1.05)}
.btn-g{border-color:transparent;background:transparent;color:var(--muted)}
.btn-g:hover{color:var(--ink);border-color:var(--line-strong)}
.btn-d{color:var(--bad);border-color:rgba(255,92,122,.3);background:transparent}
.btn-d:hover{border-color:var(--bad)}
.btn-sm{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn-lg{padding:13px 22px;font-size:1rem;border-radius:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.pill.mk{background:var(--marker);color:var(--marker-ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--accent));box-shadow:0 0 8px color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:650;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:#050507;border-radius:11px;padding:9px 11px;font-size:16px;min-width:0}
textarea.input{resize:vertical;min-height:110px;line-height:1.55}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent));box-shadow:0 0 12px var(--c,var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .big{font-size:34px}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--sheet-2);border:1px solid var(--line);gap:3px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:650;font-size:.86rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#000}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--sheet);font-weight:650;font-size:.85rem;max-width:100%;color:var(--ink);text-decoration:none}
.chip>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--sheet));box-shadow:0 0 14px -4px var(--c,var(--accent))}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:13px;background:var(--marker-soft);border:1px solid rgba(255,228,92,.35);font-size:.88rem}
.view-in{animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Hoy */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello .date{font-size:.95rem;color:var(--muted);margin-top:4px}
.school{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
@media (max-width:600px){.stat{flex-direction:column;align-items:flex-start;gap:10px}.prio{grid-template-columns:auto 1fr}.prio>.row{grid-column:1/-1;justify-content:flex-end}}
.stat{display:flex;align-items:center;gap:14px;padding:14px 16px}
.stat b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.stat-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:22px;background:var(--sheet-2);border:1px solid var(--line)}
.stat-ic.mk{background:var(--marker-soft);border-color:rgba(255,228,92,.3)}
.mini-ring{width:46px;height:46px;flex:none}
.blk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .t{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:46px}
.blk .ttl{font-weight:650;min-width:0;overflow-wrap:anywhere}
.blk.done .ttl{text-decoration:line-through;color:var(--faint)}
.check{width:23px;height:23px;border-radius:7px;border:2px solid var(--line-strong);background:transparent;display:grid;place-items:center;flex:none;padding:0;color:#000}
.check[aria-checked="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));box-shadow:0 0 10px -2px var(--c,var(--accent))}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.exam{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exam:first-child{border-top:0}
.exam .cd{min-width:60px;text-align:center;border-radius:12px;padding:7px 4px;background:var(--accent-soft);color:var(--accent)}
.exam .cd b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1}
.exam .cd small{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.exam .cd.bad{background:var(--bad-soft);color:var(--bad)} .exam .cd.warn{background:var(--warn-soft);color:var(--warn)}
.prio{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prio:first-child{border-top:0}
.semo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--sheet-2));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}

/* Foco */
.focus-wrap{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:980px){.focus-wrap{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.timer-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 18px}
.ring{position:relative;width:min(78vw,320px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--c,var(--accent));transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 10px var(--c,var(--accent)))}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.clock{font-family:var(--f-mono);font-weight:700;font-size:clamp(3rem,13vw,4.4rem);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.phase{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.cycle-dots{display:flex;gap:6px;margin-top:8px}
.cycle-dots i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.cycle-dots i.on{background:var(--marker);box-shadow:0 0 8px var(--marker)}
.timer-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.focus-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;width:100%;max-width:520px}
.durations{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:10px}
.sess{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.sess:first-child{border-top:0}

/* Asignaturas */
.subj-card{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;overflow:hidden;transition:transform .15s ease,border-color .15s ease}
.subj-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);box-shadow:0 0 18px var(--c)}
.subj-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.subj-card .nm{font-family:var(--f-display);font-weight:700;font-size:1.06rem;line-height:1.2;overflow-wrap:anywhere}
.subj-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.topic{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic .tt{min-width:0;overflow-wrap:anywhere}
.topic.done .tt{text-decoration:line-through;color:var(--faint)}
.wbtn{border:1px solid var(--line-strong);background:transparent;border-radius:99px;font-size:.72rem;font-weight:700;padding:3px 9px;color:var(--muted);white-space:nowrap}
.wbtn[data-w="3"]{background:var(--marker-soft);border-color:rgba(255,228,92,.45);color:var(--marker)}
.wbtn[data-w="2"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.x-btn{border:0;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;padding:0;flex:none}
.x-btn:hover{color:var(--bad);background:var(--bad-soft)}
.x-btn svg{width:15px;height:15px}
.colors,.emojis{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid var(--sheet);background:var(--c);box-shadow:0 0 0 1px var(--line-strong)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink),0 0 14px var(--c)}
.emojis button{width:40px;height:40px;border-radius:11px;border:1px solid var(--line-strong);background:var(--sheet-2);font-size:20px;display:grid;place-items:center;padding:0}
.emojis button[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.subj-head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.subj-head .semo{width:56px;height:56px;font-size:28px;border-radius:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:.92rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c,var(--accent))}
.tabs .cnt{font-family:var(--f-mono);font-size:.72rem;background:var(--sheet-2);border:1px solid var(--line);padding:1px 7px;border-radius:99px;color:var(--muted)}

/* Documentos */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.doc{display:flex;gap:12px;align-items:flex-start;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s ease,transform .15s ease;text-decoration:none}
.doc:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.doc .di{font-size:26px;flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sheet-2);border:1px solid var(--line)}
.doc .dt{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);transition:border-color .15s ease,background .15s ease;cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.doc-text{white-space:pre-wrap;font-size:.92rem;line-height:1.6;max-height:60vh;overflow-y:auto;background:#050507;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-wrap:anywhere}
.note-area{min-height:52vh!important;font-size:16px;line-height:1.65}
.doc-img{max-width:100%;max-height:60vh;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto}

/* Chats */
.chat-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.chat-row:first-child{border-top:0}

/* colecciones: docs (metadatos), doctext (texto), chats (metadatos), chatmsgs (mensajes), decks (tarjetas), files (archivos originales) */
const watchers = {};
async function fire(c) { const cb = watchers[c]; if (cb && idb) cb(await idbAll(c)); }

function sWatch(c, cb) { watchers[c] = cb; fire(c); }
function initStores() {
  sWatch("docs", list => { S.docs = list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); storeReady = true; render(); });
  sWatch("chats", list => { S.chats = list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); storeReady = true; render(); });
  sWatch("decks", list => { const m = {}; list.forEach(d => { m[d.id] = Array.isArray(d.cards) ? d.cards : []; }); S.decks = m; render(); });
  sWatch("studio", list => { S.studio = list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); render(); });
}
const CH = 2000000;
async function saveText(id, text, oldParts = 0) {
  const parts = Math.max(1, Math.ceil(text.length / CH));
  for (let i = 0; i < parts; i++) await sPut("doctext", id + "_" + i, { t: text.slice(i * CH, (i + 1) * CH) });
  for (let i = parts; i < oldParts; i++) await sDel("doctext", id + "_" + i);
  textCache.set(id, text); return parts;
}
async function loadText(id) {

  const m = S.docs.find(d => d.id === id); const n = (m && m.parts) || 0; let out = "";
  for (let i = 0; i < n; i++) { const d = await sGet("doctext", id + "_" + i); out += d ? d.t : ""; }
  textCache.set(id, out); return out;
}
async function loadMsgs(id) { if (msgCache.has(id)) return msgCache.get(id); const d = await sGet("chatmsgs", id); const m = (d && d.messages) || []; msgCache.set(id, m); return m; }

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFW = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
const scripts = {};
function loadScript(src) { return scripts[src] = scripts[src] || new Promise((res, rej) => { const t = document.createElement("script"); t.src = src; t.onload = res; t.onerror = () => { delete scripts[src]; rej(new Error("no se pudo cargar el lector")); }; document.head.appendChild(t); }); }
async function pdfText(f) {
  await loadScript(PDFW); await loadScript(PDFJS);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFW;
  const pdf = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise; const out = [];
  for (let i = 1; i <= pdf.numPages; i++) { const tc = await (await pdf.getPage(i)).getTextContent(); out.push(tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("")); }
  return out.join("\n\n").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function docxText(f) { await loadScript(MAMMOTH); const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() }); return (r.value || "").trim(); }
let pickFor = null;
function openFilePicker(sid) { pickFor = sid; const fi = $("#fileIn"); fi.value = ""; fi.click(); }
$("#fileIn").addEventListener("change", e => { if (pickFor) handleFiles(e.target.files, pickFor); });
$("#camIn").addEventListener("change", e => { if (pickFor) handleFiles(e.target.files, pickFor); });
async function handleFiles(files, sid) {
  const list = [...(files || [])]; if (!list.length) return;
  let ok = 0;
  for (const f of list) {
    toast(`⏳ Procesando ${f.name}…`);
    try {
      const ext = (f.name.split(".").pop() || "").toLowerCase(); let type = "file", text = "";
      if (f.type === "application/pdf" || ext === "pdf") { type = "pdf"; text = await pdfText(f); }
      else if (ext === "docx") { type = "docx"; text = await docxText(f); }
      else if ((f.type || "").startsWith("image/")) type = "image";
      else if (/^(txt|md|csv|json)$/.test(ext) || (f.type || "").startsWith("text/")) { type = "text"; text = await f.text(); }
      else throw { msg: "formato no compatible (usa PDF, Word, imagen o texto)" };
      let fileId = null;
      if (type !== "text") { fileId = uid(); try { await idbPut("files", fileId, f); } catch (e) { throw { code: "quota" }; } }
      const id = uid(), now = Date.now();
      const parts = text ? await saveText(id, text) : 0;

function citeHtml(html, cites) {
  if (!cites) return html;
  return html.replace(/\[(D\d+(?:\s*,\s*D\d+)*)\]/g, (all, list) => list.split(/\s*,\s*/).map(k => { const d = S.docs.find(x => x.id === cites[k]); return d ? `<a class="cite" href="#doc-${d.id}">${DOC_EMO[d.type] || "📄"} ${esc((d.title || "").slice(0, 28))}</a>` : ""; }).join("") || all);
}

async function exportAll() {
  if (!idb) return; toast("⏳ Preparando copia…");
  try {
    flushState();
    const out = { app: "pupitre", v: 2, at: Date.now(), state, col: {}, files: [] };
    for (const c of ["docs", "doctext", "chats", "chatmsgs", "decks", "studio"]) out.col[c] = await idbAll(c);
    for (const d of out.col.docs) if (d.fileId) { const b = await idbGet("files", d.fileId); if (b) out.files.push({ id: d.fileId, type: b.type || "", data: await blobToB64(b) }); }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: "application/json" })); a.download = `pupitre-copia-${dkey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);

  } catch (e) { toast("⚠️ No se pudo crear la copia"); }
}
async function importAll(file) {
  try {
    const d = JSON.parse(await file.text()); if (!d || d.app !== "pupitre" || !d.state) throw 0;
    for (const c of ["docs", "doctext", "chats", "chatmsgs", "decks", "files", "studio"]) await tx(c, "readwrite", o => o.clear());
    for (const c in d.col || {}) for (const it of d.col[c]) { const { id, ...rest } = it; await idbPut(c, id, rest); }
    for (const f of d.files || []) { const bin = atob(f.data); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); await idbPut("files", f.id, new Blob([u], { type: f.type })); }
    state = migrate(d.state); await idbPut("kv", "state", state);
    textCache.clear(); msgCache.clear(); urlCache.clear();
    await Promise.all(["docs", "chats", "decks", "studio"].map(fire)); closeModal(); go("hoy"); render(); toast("✅ Copia restaurada");
  } catch (e) { toast("❌ Ese archivo no es una copia válida de Pupitre"); }
}

    case "review-stop": review = null; render(); break;
    case "go-review": ui.asigTab = "estudiar"; ui.studyTab = "tarjetas"; saveUi(); go("asig-" + a.dataset.s); startReview(a.dataset.s); break;
    case "mock-start": startMock(); break;
    case "mock-submit": submitMock(cur.id); break;
    case "mock-new": tut(cur.id).mock = null; commit(); break;
    case "clear-example": { const name = state.profile.name; state = blankState(); state.profile.name = name; state.profile.school = SCHOOL; resetTimer(); commit(false); go("hoy"); render(); toast("🧹 Ejemplo borrado. Elige tus módulos."); modulesModal(); break; }
  }
});
$("#settingsBtn").addEventListener("click", () => { if (state) settingsModal(); });
